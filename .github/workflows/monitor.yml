name: Issue Monitor

on:
  schedule:
    - cron: '7,23,41,59 * * * *'
  workflow_dispatch:

concurrency:
  group: issue-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check monitor files
        run: |
          echo "Current branch: $(git branch --show-current)"
          ls -la
          test -f monitor_issues.py
          test -f config.json

      - name: Run Monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: Meren-rodrigo/Support
        run: |
          python monitor_issues.py

      - name: Commit tracking files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add processed_issues.json safety_tracking.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No tracking changes"
            exit 0
          fi

          git commit -m "Update tracking [skip ci]"

          # Rebase in case another run pushed to main while we were working
          git pull --rebase origin main
          git push
