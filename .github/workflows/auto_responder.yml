name: Auto Responder

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Debug - list files
      run: ls -la

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Auto Responder
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TARGET_REPO: ${{ github.repository }}
      run: |
        python auto_responder.py

    - name: Debug - check files
      run: |
        echo "=== Files in repo ==="
        ls -la
        echo "=== bot_responses.json exists? ==="
        test -f bot_responses.json && echo "YES" || echo "NO"
        echo "=== responded_issues.json exists? ==="
        test -f responded_issues.json && echo "YES" || echo "NO"
